services:
  - type: web
    name: maaya-groq-proxy
    env: python
    rootDir: portfolio/maaya_proxy
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT app:app
    envVars:
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_FALLBACK_MODELS
        value: openai/gpt-oss-120b,openai/gpt-oss-20b
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: GEMINI_FALLBACK_MODELS
        value: gemini-2.0-flash,gemini-2.5-flash
      - key: MAAYA_LLM_PROVIDERS
        value: groq,gemini
      - key: LLAMA_GUARD_ENABLED
        value: "1"
      - key: LLAMA_GUARD_MODEL
        value: openai/gpt-oss-safeguard-20b
      - key: LLAMA_GUARD_TIMEOUT
        value: "12"
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: portfolio
      - key: MONGODB_FEEDBACK_COLLECTION
        value: viewer_feedback
      - key: LANGSMITH_TRACING
        value: "false"
      - key: LANGSMITH_PROJECT
        value: maaya-portfolio-assistant
      - key: LANGSMITH_API_KEY
        sync: false
