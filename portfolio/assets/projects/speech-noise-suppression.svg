<svg width="320" height="220" viewBox="0 0 320 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="320" height="220" rx="28" fill="#0C1325"/>
  <rect x="20" y="20" width="280" height="180" rx="22" fill="url(#bg)"/>
  <circle cx="68" cy="56" r="24" fill="#F87171" fill-opacity=".12"/>
  <circle cx="254" cy="54" r="22" fill="#63F1D4" fill-opacity=".15"/>

  <!-- Audio Processing Window -->
  <rect x="44" y="48" width="232" height="110" rx="16" fill="#0F172A" stroke="#253858" stroke-width="2"/>

  <!-- Left: Noisy Waveform -->
  <text x="80" y="68" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#F87171" letter-spacing="1">NOISY</text>
  <path d="M 54 102 L 60 88 L 66 116 L 72 82 L 78 122 L 84 90 L 90 114 L 96 96 L 102 108 L 108 102" stroke="#F87171" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Left Noise Spectral Bars -->
  <rect x="58" y="138" width="4" height="10" rx="2" fill="#F87171" fill-opacity=".6"/>
  <rect x="66" y="132" width="4" height="16" rx="2" fill="#F87171" fill-opacity=".8"/>
  <rect x="74" y="135" width="4" height="13" rx="2" fill="#F87171" fill-opacity=".7"/>
  <rect x="82" y="129" width="4" height="19" rx="2" fill="#F87171" fill-opacity=".9"/>
  <rect x="90" y="136" width="4" height="12" rx="2" fill="#F87171" fill-opacity=".6"/>
  <rect x="98" y="133" width="4" height="15" rx="2" fill="#F87171" fill-opacity=".7"/>

  <!-- Transition Arrow Left -->
  <path d="M 114 102 H 125" stroke="#F8C86A" stroke-width="3" stroke-linecap="round"/>
  <path d="M 121 97 L 126 102 L 121 107" stroke="#F8C86A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Center: 2D U-Net Mask Filter -->
  <rect x="134" y="62" width="52" height="82" rx="12" fill="#13233C" stroke="#63F1D4" stroke-width="2"/>
  <rect x="142" y="70" width="15" height="18" rx="4" fill="#63F1D4" fill-opacity=".85"/>
  <rect x="163" y="70" width="15" height="18" rx="4" fill="#63F1D4" fill-opacity=".25"/>
  <rect x="142" y="93" width="15" height="18" rx="4" fill="#63F1D4" fill-opacity=".2"/>
  <rect x="163" y="93" width="15" height="18" rx="4" fill="#63F1D4" fill-opacity=".9"/>
  <text x="160" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="8.5" font-weight="800" fill="#63F1D4" letter-spacing="1">U-NET</text>

  <!-- Transition Arrow Right -->
  <path d="M 194 102 H 205" stroke="#63F1D4" stroke-width="3" stroke-linecap="round"/>
  <path d="M 201 97 L 206 102 L 201 107" stroke="#63F1D4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Right: Clean Speech Waveform -->
  <text x="240" y="68" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#63F1D4" letter-spacing="1">CLEAN</text>
  <path d="M 214 102 C 220 78, 226 78, 232 102 C 238 126, 244 126, 250 102 C 256 86, 260 86, 266 102" stroke="#63F1D4" stroke-width="3" stroke-linecap="round"/>

  <!-- Right Clean Spectral Bars -->
  <rect x="220" y="138" width="4" height="10" rx="2" fill="#63F1D4" fill-opacity=".5"/>
  <rect x="228" y="132" width="4" height="16" rx="2" fill="#63F1D4" fill-opacity=".85"/>
  <rect x="236" y="127" width="4" height="21" rx="2" fill="#63F1D4" fill-opacity=".95"/>
  <rect x="244" y="131" width="4" height="17" rx="2" fill="#63F1D4" fill-opacity=".85"/>
  <rect x="252" y="137" width="4" height="11" rx="2" fill="#63F1D4" fill-opacity=".6"/>
  <rect x="260" y="141" width="4" height="7" rx="2" fill="#63F1D4" fill-opacity=".4"/>

  <!-- Bottom Pills -->
  <rect x="42" y="174" width="112" height="22" rx="11" fill="#0F172A" fill-opacity=".88"/>
  <rect x="162" y="174" width="116" height="22" rx="11" fill="#0F172A" fill-opacity=".88"/>
  <text x="98" y="189" text-anchor="middle" fill="#63F1D4" font-family="Arial, sans-serif" font-size="12" font-weight="700">Speech AI</text>
  <text x="220" y="189" text-anchor="middle" fill="#F8C86A" font-family="Arial, sans-serif" font-size="12" font-weight="700">U-Net Denoise</text>

  <defs>
    <linearGradient id="bg" x1="28" y1="24" x2="286" y2="196" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111E38"/>
      <stop offset="1" stop-color="#142746"/>
    </linearGradient>
  </defs>
